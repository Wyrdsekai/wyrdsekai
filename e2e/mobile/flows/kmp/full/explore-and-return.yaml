# Full: KMP — Explore standalone room, interact, settle back home
# Local-mode replacement for the legacy remote-mode "explore + logout" tour.
appId: org.wyrdsekai.kmp
---
- runFlow: ../_helpers/register-and-connect.yaml

# Lands in companion's home room.
- assertVisible:
    id: "standalone-room-name"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_explore_01_home

# Look around
- tapOn:
    id: "standalone-input"
- inputText: "look"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 5000
- takeScreenshot: kmp_explore_02_looked

# Say hello
- tapOn:
    id: "standalone-input"
- inputText: "'Hello world, I'm exploring"
- tapOn:
    id: "standalone-send-button"
- takeScreenshot: kmp_explore_03_said_hello

# Walk through any available exit (typed — exits may not be present in seed Hearth)
- tapOn:
    id: "standalone-input"
- inputText: "go north"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 10000
- takeScreenshot: kmp_explore_04_moved

# Say something
- tapOn:
    id: "standalone-input"
- inputText: "'Interesting place"
- tapOn:
    id: "standalone-send-button"
- takeScreenshot: kmp_explore_05_said_something

# Return south
- tapOn:
    id: "standalone-input"
- inputText: "go south"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 10000
- takeScreenshot: kmp_explore_06_returned

# Dismiss IME (typing leaves the soft keyboard up over the toolbar) and open settings
- hideKeyboard
- tapOn:
    id: "standalone-settings-button"
- extendedWaitUntil:
    visible:
      id: "switch-mode-button"
    timeout: 5000
- takeScreenshot: kmp_explore_07_settings
