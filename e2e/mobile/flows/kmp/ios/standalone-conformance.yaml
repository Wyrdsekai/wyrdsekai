# Full (iOS): KMP — Standalone-mode MUD conformance on the iOS simulator.
#
# Exercises PhoneNode.examine/.rename/.drop + LocalRoomScreen parser end-to-end
# against PhoneNode.ios (no server, no API key). iOS twin of
# ../full/standalone-conformance.yaml — asserts on testTag-keyed structural
# elements (prose-list survives each action) + screenshots, since Compose Text
# nodes report zero bounds to the accessibility tree.
appId: org.wyrdsekai.kmp
---
- runFlow: _helpers/standalone-onboard.yaml

- takeScreenshot: kmp_ios_standalone_conf_00_landed

# Default playerName "You" — examine me must not crash.
- tapOn:
    id: "standalone-input"
- inputText: "examine me"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_01_examine_me_default

# §7.4 — rename me Tester.
- tapOn:
    id: "standalone-input"
- inputText: "rename me Tester"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_02_rename_me

# §7.4 reflection — examine me must now show the new name.
- tapOn:
    id: "standalone-input"
- inputText: "examine me"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_03_examine_me_renamed

# §7.4 rejection — rename me with no name.
- tapOn:
    id: "standalone-input"
- inputText: "rename me"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_04_rename_me_empty

# §2.2 — examine a thing that doesn't exist.
- tapOn:
    id: "standalone-input"
- inputText: "examine zzzNothingHere"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_05_examine_unknown

# §4 — drop nonsense must not crash the screen.
- tapOn:
    id: "standalone-input"
- inputText: "drop zzzGhostObject"
- tapOn:
    id: "standalone-send-button"
- assertVisible:
    id: "standalone-input"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_standalone_conf_06_drop_nonsense
