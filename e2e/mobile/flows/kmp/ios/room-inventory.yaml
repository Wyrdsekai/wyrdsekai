# Quick (iOS): KMP — typed "/inventory" verb path in the standalone room.
# iOS twin of ../quick/room-inventory.yaml.
appId: org.wyrdsekai.kmp
---
- runFlow: _helpers/standalone-onboard.yaml

- tapOn:
    id: "standalone-input"
- inputText: "/inventory"

- tapOn:
    id: "standalone-send-button"

- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 5000

- takeScreenshot: kmp_ios_quick_room_inventory
