# Helper (iOS): KMP Welcome wizard → "Just explore on my own" → standalone
# room. Pure-standalone path (no server URL, no API key) — PhoneNode.ios boots
# its local engine and renders LocalRoomScreen. iOS twin of
# ../../_helpers/standalone-onboard.yaml (appId differs: org.wyrdsekai.kmp).
appId: org.wyrdsekai.kmp
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: ${BOOT_TIMEOUT}

- tapOn:
    id: "welcome-no-server"

- extendedWaitUntil:
    visible:
      id: "welcome-standalone"
    timeout: 5000
- tapOn:
    id: "welcome-standalone"

- extendedWaitUntil:
    visible:
      id: "standalone-room-name"
    timeout: ${CONNECT_TIMEOUT}
