# Full (iOS): KMP — explore the standalone room, interact, open settings.
# iOS twin of ../full/explore-and-return.yaml (standalone path; no server).
appId: org.wyrdsekai.kmp
---
- runFlow: _helpers/standalone-onboard.yaml

- assertVisible:
    id: "standalone-room-name"
- assertVisible:
    id: "standalone-prose-list"
- takeScreenshot: kmp_ios_explore_01_home

# Look around
- tapOn:
    id: "standalone-input"
- inputText: "look"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 5000
- takeScreenshot: kmp_ios_explore_02_looked

# Say hello
- tapOn:
    id: "standalone-input"
- inputText: "'Hello world, I'm exploring"
- tapOn:
    id: "standalone-send-button"
- takeScreenshot: kmp_ios_explore_03_said_hello

# Walk through any available exit (typed — exits may not be in the seed Hearth)
- tapOn:
    id: "standalone-input"
- inputText: "go north"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 10000
- takeScreenshot: kmp_ios_explore_04_moved

# Return south
- tapOn:
    id: "standalone-input"
- inputText: "go south"
- tapOn:
    id: "standalone-send-button"
- extendedWaitUntil:
    visible:
      id: "standalone-prose-list"
    timeout: 10000
- takeScreenshot: kmp_ios_explore_05_returned

# (Opening the settings dialog is covered by room-settings.yaml; not repeated
# here — after typing, the Compose-iOS soft keyboard covers the settings
# button and this app exposes no dismiss affordance.)
