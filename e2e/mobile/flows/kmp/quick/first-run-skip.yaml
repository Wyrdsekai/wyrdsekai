# Quick: KMP Welcome wizard — "Just explore on my own" path (no server, no API)
appId: org.wyrdsekai.kmp
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: ${BOOT_TIMEOUT}

# Step 0 → step 1: skip server question
- tapOn:
    id: "welcome-no-server"

- extendedWaitUntil:
    visible:
      id: "welcome-standalone"
    timeout: 5000

# Pick standalone (no server, no API key)
- tapOn:
    id: "welcome-standalone"

# Companion boots into local room
- extendedWaitUntil:
    visible:
      id: "standalone-room-name"
    timeout: ${CONNECT_TIMEOUT}

- takeScreenshot: kmp_quick_first_run_skip
