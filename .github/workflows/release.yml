name: Release

# Attest published release artifacts with Sigstore (keyless).
#
# Wyrdsekai releases are BUILT on household hardware — each installer is a
# native-OS build validated on a live node before the steward publishes the
# GitHub release. This workflow deliberately builds nothing. It fires when a
# release is published, downloads each asset, checks it against the release's
# own SHA256SUMS, and attests the artifact hash via Sigstore keyless signing.
# The resulting <asset>.sigstore.json bundle is uploaded back to the release
# as a sibling asset.
#
# What the signature MEANS: "the Wyrdsekai release workflow, running at this
# tag, blessed these exact bytes." It is an authenticity statement from the
# project's pinned CI identity — not SLSA build provenance (the bytes were
# built by the household pipeline, not by this runner). The predicate says so
# explicitly.
#
# Verification (from a user machine, no cosign install needed):
#   wyrd verify-release wyrdsekai_X.Y.Z_amd64.deb
# which uses sigstore-java embedded in the wyrd binary to walk the full
# chain: Fulcio cert -> pinned workflow identity (BuiltinReleaseTrust) ->
# Rekor inclusion proof.
#
# Uses ONLY GitHub-authored actions (actions/*) so the repo's Actions policy
# can stay at "Wyrdsekai + actions created by GitHub".

on:
  release:
    types: [published]
  # Re-run for an already-published tag (e.g. the attest job failed):
  #   gh workflow run release.yml --ref v0.1.5
  # The ref MUST be the release tag — the Sigstore cert identity embeds the
  # ref, and wyrd binaries only trust release.yml@refs/tags/v*.*.*.
  workflow_dispatch: {}

permissions:
  contents: write        # upload .sigstore.json bundles to the release
  id-token: write        # Sigstore keyless signing via GitHub OIDC
  attestations: write    # actions/attest -> GitHub attestation store

jobs:
  attest:
    name: Attest ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: deb
            pattern: 'wyrdsekai_*_amd64.deb'
          - artifact: pkg
            pattern: 'Wyrdsekai-*.pkg'
          - artifact: msi
            pattern: 'Wyrdsekai-*.msi'
          - artifact: tarball
            pattern: 'wyrdsekai-[0-9]*.tar.gz'
          - artifact: relay
            pattern: 'wyrdsekai-relay-*.tar.gz'
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            echo "workflow_dispatch must run on a tag ref (got $GITHUB_REF)." >&2
            echo "Use: gh workflow run release.yml --ref vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attesting release $TAG"

      - name: Download asset + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ matrix.pattern }}' \
            --dir assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHA256SUMS*' \
            --dir assets
          ls -lh assets

      - name: Verify checksum before attesting
        id: asset
        run: |
          cd assets
          FILE=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n')
          COUNT=$(printf '%s\n' "$FILE" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one asset for pattern '${{ matrix.pattern }}', got $COUNT:" >&2
            printf '%s\n' "$FILE" >&2
            exit 1
          fi
          EXPECTED=$(awk -v f="$FILE" '$2 == f { print $1 }' SHA256SUMS*)
          if [ -z "$EXPECTED" ]; then
            echo "$FILE not listed in the release's SHA256SUMS — refusing to attest." >&2
            exit 1
          fi
          ACTUAL=$(sha256sum "$FILE" | awk '{ print $1 }')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch for $FILE (expected $EXPECTED, got $ACTUAL) — refusing to attest." >&2
            exit 1
          fi
          echo "Checksum OK: $ACTUAL  $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Attest
        id: attest
        uses: actions/attest@v3
        with:
          subject-path: assets/${{ steps.asset.outputs.file }}
          predicate-type: 'https://wyrdsekai.org/attestation/release/v1'
          predicate: >-
            {"tag": "${{ steps.tag.outputs.tag }}",
             "checksumSource": "release SHA256SUMS, verified pre-attestation",
             "builder": "household native-OS build pipeline, steward-validated on a live node before publish",
             "attestedBy": "post-publish attestation via .github/workflows/release.yml"}

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="${{ steps.attest.outputs.bundle-path }}"
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "actions/attest produced no bundle" >&2
            exit 1
          fi
          # Convention: wyrd verify-release resolves <artifact>.sigstore.json
          # as the sibling bundle of <artifact>.
          OUT="assets/${{ steps.asset.outputs.file }}.sigstore.json"
          cp "$BUNDLE" "$OUT"
          gh release upload "${{ steps.tag.outputs.tag }}" "$OUT" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Uploaded $(basename "$OUT")"
