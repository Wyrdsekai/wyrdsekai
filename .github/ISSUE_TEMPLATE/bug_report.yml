name: Bug Report
description: Report a bug in Wyrdsekai
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Start server with `wyrdsekai`
        2. Connect via telnet
        3. Type ...
        4. See error

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Telnet
        - SSH
        - WebSocket
        - HTTP API
        - CLI
        - Phone (Android)
        - Phone (iOS)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Wyrdsekai version
      description: Output of `wyrdsekai update status` or check /health endpoint
      placeholder: "0.1.0-SNAPSHOT"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (x86_64)
        - Linux (arm64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output (from ~/.wyrdsekai/logs/)
      render: shell
