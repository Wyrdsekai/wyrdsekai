name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why?
      description: What problem does this solve? What use case does it enable?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core (rooms, agents, vitality)
        - Soul system (Forge, manifests, identity)
        - MUD commands / interaction
        - Library / Knowledge
        - Study (private content)
        - Between (mesh networking)
        - Phone / mobile client
        - Room scripting (JavaScript)
        - Infrastructure (backup, update, install)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other approaches?
