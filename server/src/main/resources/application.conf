pekko {
  actor {
    # Local provider — no Artery transport, no cluster overhead.
    # Multi-node coordination handled by NATS-based Between layer.
    # ClusterSharding's Artery transport corrupts WiFi routing on macOS
    # dual-homed machines — see mac-node-nats-issue.md for full analysis.
    provider = "local"

    serialization-bindings {
      "org.wyrdsekai.core.room.RoomEvent" = jackson-json
      "org.wyrdsekai.core.room.RoomState" = jackson-json
      "org.wyrdsekai.core.room.RoomCommand" = jackson-json
      "org.wyrdsekai.core.room.RoomNotification" = jackson-json
      "org.wyrdsekai.core.room.RoomResponse" = jackson-json
      "org.wyrdsekai.core.economy.CountingHouseCommand" = jackson-json
      "org.wyrdsekai.core.economy.CountingHouseEvent" = jackson-json
      "org.wyrdsekai.core.economy.CountingHouseState" = jackson-json
      "org.wyrdsekai.core.soul.ForgeEvent" = jackson-json
      "org.wyrdsekai.core.soul.ForgeCommand" = jackson-json
      "org.wyrdsekai.core.soul.ForgeState" = jackson-json
    }
  }

  persistence {
    journal {
      plugin = "jdbc-journal"
      auto-start-journals = ["jdbc-journal"]
    }
    snapshot-store {
      plugin = "jdbc-snapshot-store"
      auto-start-snapshot-stores = ["jdbc-snapshot-store"]
    }
  }

  loglevel = "INFO"
}

# pekko-persistence-jdbc configuration
jdbc-journal {
  slick = ${slick}
}

jdbc-snapshot-store {
  slick = ${slick}
}

jdbc-read-journal {
  slick = ${slick}
}

jdbc-durable-state-store {
  slick = ${slick}
}

# Slick database configuration — SQLite via xerial JDBC driver
slick {
  profile = "slick.jdbc.SQLiteProfile$"
  db {
    url = "jdbc:sqlite:"${wyrdsekai.db.path}
    driver = "org.sqlite.JDBC"
    connectionPool = "disabled"
    keepAliveConnection = true
    # Must be > 1 to avoid Slick thread pool starvation under concurrent persist.
    # With numThreads=1, persist completion Futures queue behind active writes
    # and thenRun() callbacks never fire. SQLite serializes writes internally.
    # See: https://github.com/akka/akka-persistence-jdbc/blob/main/doc/deadlock.md
    numThreads = 4
  }
}

# Wyrdsekai application config
#
# Every WYRDSEKAI_* environment variable (including the many read directly by
# Java/bin/wyrd and never surfaced here) is documented in docs/CONFIG.md.
# In-world: stewards can browse and set the same keys via the Study's
# scroll of settings (`use scroll list`, `use scroll set KEY=value`).
wyrdsekai {
  # HTTP/WebSocket port
  port = 7070
  port = ${?WYRDSEKAI_PORT}

  # outbound Nostr publishing.
  # Companions opted-in via per-DID Safe slot (nostr.keypairs.<did>) get an
  # npub derived from their DID and can publish via world.nostr.publish(...).
  # Off by default; nothing happens until a steward enables.
  nostr {
    enabled = false
    enabled = ${?WYRDSEKAI_NOSTR_ENABLED}
    publish_relays = [
      "wss://relay.damus.io",
      "wss://nos.lol",
      "wss://relay.snort.social"
    ]
    max_events_per_minute = 60
    max_events_per_minute = ${?WYRDSEKAI_NOSTR_MAX_EVENTS_PER_MINUTE}
  }

  # Hostname (used for WebAuthn rpId, CORS, etc.)
  hostname = "localhost"
  hostname = ${?WYRDSEKAI_HOSTNAME}

  # Test mode — E2E testing only. Auto-provisions test user, disables rate limits.
  test-mode = false
  test-mode = ${?WYRDSEKAI_TEST_MODE}

  web {
    # Browser client served at /app (single-file page from the classpath).
    # Turn off with WYRDSEKAI_WEB_APP=false in wyrdsekai.conf or the env.
    app-enabled = true
    app-enabled = ${?WYRDSEKAI_WEB_APP}
  }

  websocket {
    # Guest (anonymous) web/CLI access is OFF by default — a fresh node is
    # invite-only, matching SSH/telnet which dropped guest entry entirely
    # Set WYRDSEKAI_ALLOW_ANONYMOUS=true to open
    # the Nexus to un-authenticated guests.
    allow-anonymous = false
    allow-anonymous = ${?WYRDSEKAI_ALLOW_ANONYMOUS}
    max-connections = 100
    max-connections = ${?WYRDSEKAI_MAX_CONNECTIONS}
  }

  # TLS — optional HTTPS support (disabled by default)
  # For internet-facing deployments, prefer a reverse proxy (Caddy, nginx).
  # For household/LAN, enable TLS with auto-generated self-signed certs.
  tls {
    enabled = false
    enabled = ${?WYRDSEKAI_TLS_ENABLED}
    port = 7443
    port = ${?WYRDSEKAI_TLS_PORT}
    # Path to JKS keystore. If missing and auto-generate=true, a self-signed cert is created.
    keystore-path = ""
    keystore-path = ${?WYRDSEKAI_TLS_KEYSTORE}
    keystore-password = "wyrdsekai"
    keystore-password = ${?WYRDSEKAI_TLS_PASSWORD}
    # Auto-generate self-signed cert if keystore is missing (dev/LAN convenience)
    auto-generate = true
    auto-generate = ${?WYRDSEKAI_TLS_AUTO_GENERATE}
  }

  # Household security (Wave 1: Accounts & Security)
  auth {
    # Registration is invite-only, enforced by AuthService (F4). The old
    # open-registration key + WYRDSEKAI_OPEN_REGISTRATION env hook are GONE —
    # they had no reader since F4 and setting them silently did nothing
    # (audit 2026-07-11). Use `wyrd invite` to admit new members.
  }

  # Rate limiting — per-IP request limits per minute
  rate-limit {
    enabled = true
    enabled = ${?WYRDSEKAI_RATE_LIMIT_ENABLED}
    auth = 20
    auth = ${?WYRDSEKAI_RATE_LIMIT_AUTH}
    soul = 60
    soul = ${?WYRDSEKAI_RATE_LIMIT_SOUL}
    inference = 30
    inference = ${?WYRDSEKAI_RATE_LIMIT_INFERENCE}
    websocket = 10
    websocket = ${?WYRDSEKAI_RATE_LIMIT_WS}
  }

  backup {
    enabled = true
    enabled = ${?WYRDSEKAI_BACKUP_ENABLED}
    interval-hours = 24
    interval-hours = ${?WYRDSEKAI_BACKUP_INTERVAL_HOURS}
    max-snapshots = 5
  }

  db {
    # Default set programmatically via SystemPaths.dbPath() in Main.java.
    # Cross-platform: %APPDATA%\wyrdsekai\world.db (Windows), ~/.wyrdsekai/world.db (Linux/macOS).
    # Override via -Dwyrdsekai.db.path=... (a WYRDSEKAI_DB_PATH env var was
    # documented here for years but never had a reader — audit 2026-07-11).
    #
    # The two-line form (default then optional ${?...} override) avoids the
    # self-referential substitution cycle that fires in tests which call
    # ConfigFactory.load() without first setting the system property. Main.java
    # sets -Dwyrdsekai.db.path before load in production, so the override
    # always wins there. Tests that don't set the property get the empty
    # default and override it programmatically before use.
    path = ""
    path = ${?wyrdsekai.db.path}

    # Storage backend: "sqlite" (default, single-node) or "postgresql" (multi-node)
    backend = "sqlite"
    backend = ${?WYRDSEKAI_STORAGE_BACKEND}

    postgresql {
      url = "jdbc:postgresql://localhost:5432/wyrdsekai"
      url = ${?WYRDSEKAI_PG_URL}
      user = "wyrdsekai"
      user = ${?WYRDSEKAI_PG_USER}
      password = ""
      password = ${?WYRDSEKAI_PG_PASSWORD}
    }
  }

  inference {
    # Default model name (sent in API requests).
    # See MODELS.md for recommended models per hardware tier:
    #   Phone:   Gemma 3n E2B (2GB) / E4B (3GB)
    #   Edge:    GPT-OSS-20B (16GB, Apache 2.0) — recommended default
    #   Desktop: GPT-OSS-120B (80GB) / Llama 4 Scout (10M ctx)
    #   Cluster: Kimi K2.5 (1T, multi-node via llama.cpp RPC)
    default-model = "default"
    default-model = ${?WYRDSEKAI_MODEL}

    # Per-tier model overrides (§2 Model Routing Per Task).
    # ROUTINE tasks (greetings, acks) → smallest model for fast response.
    # COMPLEX tasks (analysis, multi-step) → most capable model.
    # SIMPLE tasks always use default-model.
    model-routine = ""
    model-routine = ${?WYRDSEKAI_MODEL_ROUTINE}
    model-complex = ""
    model-complex = ${?WYRDSEKAI_MODEL_COMPLEX}

    # Health check interval for all backends
    health-check-interval = 30s

    # Household inference auto-share.
    # household_share: when on, this node serves a household member's cross-zone
    #   inference request with an unlimited (family) quota, overriding any bilateral
    #   agreement. `wyrd setup` sets this on when a local GPU is detected. Default off.
    # household_borrow: when on AND this node has no usable local GPU, heavy companion
    #   inference auto-prefers a household peer's GPU backend (local CPU stays the
    #   health-fallback). Default on. Non-household peers are never auto-preferred.
    # These keys are read by WyrdConfig (env > profile.toml > default); the entries
    # here document the env overrides.
    household_share = false
    household_share = ${?WYRDSEKAI_INFERENCE_HOUSEHOLD_SHARE}
    household_borrow = true
    household_borrow = ${?WYRDSEKAI_INFERENCE_HOUSEHOLD_BORROW}

    # Inference backends — priority-ordered, first healthy backend is used.
    # Lower priority number = preferred. Enable via env vars or config override.
    backends = [
      {
        name = "llama-server"
        type = "llama-server"
        enabled = false
        enabled = ${?WYRDSEKAI_LLAMA_ENABLED}
        priority = 5
        priority = ${?WYRDSEKAI_LLAMA_PRIORITY}
        url = "http://127.0.0.1:11525"
        url = ${?WYRDSEKAI_LLAMA_URL}
        models = []
        # llama-server specific: auto-start child process
        executable = "llama-server"
        model-path = ""
        model-path = ${?WYRDSEKAI_MODEL_PATH}
        # 8192, not 4096. PromptAssembler.MIN_BACKEND_SAFE_PROMPT_TOKENS is 7500 and
        # documents 8192 as the smallest production backend, so a 4096 window cannot
        # hold a prompt the assembler is allowed to build. Real companion turns
        # measured 4606-4782 tokens and got HTTP 400 "exceeds the available context
        # size (4096 tokens)" 18 times in two hours; the router then fell back to the
        # VOICE model, which has no tools, so the companion discussed building a room
        # instead of building one (second-node, 2026-07-29).
        # NOTE: this is PER SLOT — LlamaServerManager multiplies by --parallel.
        context-size = 8192
        context-size = ${?WYRDSEKAI_CONTEXT_SIZE}
        gpu-layers = 0
        gpu-layers = ${?WYRDSEKAI_GPU_LAYERS}
        port = 11525
      },
      # Dual-inference voice backend — 4B balanced + voice LoRA adapter.
      # Enable alongside `llama-server` (skills) to route cap:quick → voice
      # and cap:reasoning → skills.
      {
        name = "llama-voice"
        type = "llama-server"
        enabled = false
        enabled = ${?WYRDSEKAI_VOICE_ENABLED}
        priority = 15
        priority = ${?WYRDSEKAI_VOICE_PRIORITY}
        url = "http://127.0.0.1:8201"
        url = ${?WYRDSEKAI_VOICE_URL}
        models = []
        # 8192, not 4096. PromptAssembler.MIN_BACKEND_SAFE_PROMPT_TOKENS is 7500 and
        # documents 8192 as the smallest production backend, so a 4096 window cannot
        # hold a prompt the assembler is allowed to build. Real companion turns
        # measured 4606-4782 tokens and got HTTP 400 "exceeds the available context
        # size (4096 tokens)" 18 times in two hours; the router then fell back to the
        # VOICE model, which has no tools, so the companion discussed building a room
        # instead of building one (second-node, 2026-07-29).
        # NOTE: this is PER SLOT — LlamaServerManager multiplies by --parallel.
        context-size = 8192
        context-size = ${?WYRDSEKAI_CONTEXT_SIZE}
      },
      {
        name = "sglang"
        type = "sglang"
        enabled = false
        enabled = ${?WYRDSEKAI_SGLANG_ENABLED}
        priority = 20
        priority = ${?WYRDSEKAI_SGLANG_PRIORITY}
        url = "http://127.0.0.1:8000"
        url = ${?WYRDSEKAI_SGLANG_URL}
        models = []
      },
      {
        name = "ollama"
        type = "ollama"
        enabled = false
        enabled = ${?WYRDSEKAI_OLLAMA_ENABLED}
        priority = 30
        priority = ${?WYRDSEKAI_OLLAMA_PRIORITY}
        url = "http://127.0.0.1:11434"
        url = ${?WYRDSEKAI_OLLAMA_URL}
        models = []
      },
      {
        name = "vllm"
        type = "vllm"
        enabled = false
        enabled = ${?WYRDSEKAI_VLLM_ENABLED}
        priority = 40
        url = "http://127.0.0.1:8100"
        url = ${?WYRDSEKAI_VLLM_URL}
        models = []
      },
      {
        name = "vllm-mlx"
        type = "vllm-mlx"
        enabled = false
        enabled = ${?WYRDSEKAI_VLLM_MLX_ENABLED}
        priority = 35
        url = "http://127.0.0.1:8200"
        url = ${?WYRDSEKAI_VLLM_MLX_URL}
        models = []
        # vllm-mlx: native Apple Silicon inference via Metal. No Docker.
        # Install: pip install vllm-mlx
        # Launch: vllm-mlx serve mlx-community/Qwen3-8B-4bit --port 8200
      },
      {
        name = "claude-cli"
        type = "claude-cli"
        enabled = false
        enabled = ${?WYRDSEKAI_CLAUDE_CLI_ENABLED}
        priority = 50
        cli-path = "claude"
        cli-path = ${?WYRDSEKAI_CLAUDE_CLI_PATH}
        models = []
      },
      {
        name = "openai"
        type = "cloud"
        provider = "openai"
        enabled = false
        enabled = ${?WYRDSEKAI_OPENAI_ENABLED}
        priority = 90
        url = "https://api.openai.com"
        url = ${?WYRDSEKAI_OPENAI_URL}
        api-key = ""
        api-key = ${?OPENAI_API_KEY}
        models = []
      },
      {
        name = "anthropic"
        type = "cloud"
        provider = "anthropic"
        enabled = false
        enabled = ${?WYRDSEKAI_ANTHROPIC_ENABLED}
        priority = 95
        url = "https://api.anthropic.com"
        url = ${?WYRDSEKAI_ANTHROPIC_URL}
        api-key = ""
        api-key = ${?ANTHROPIC_API_KEY}
        models = []
      },
      {
        name = "openrouter"
        type = "cloud"
        provider = "openai"     # OpenAI-compatible chat-completions API.
        enabled = false
        enabled = ${?WYRDSEKAI_OPENROUTER_ENABLED}
        priority = 92
        url = "https://openrouter.ai/api"
        url = ${?WYRDSEKAI_OPENROUTER_URL}
        api-key = ""
        api-key = ${?WYRDSEKAI_API_KEY_OPENROUTER}
        models = []
      }
    ]

    # Legacy config — still supported for backward compatibility.
    # If no backends are explicitly enabled, these are checked as fallback.
    local {
      enabled = false
      url = "http://127.0.0.1:11525"
      executable = "llama-server"
      model-path = ""
      model-path = ${?WYRDSEKAI_MODEL_PATH}
      # 8192, not 4096. PromptAssembler.MIN_BACKEND_SAFE_PROMPT_TOKENS is 7500 and
      # documents 8192 as the smallest production backend, so a 4096 window cannot
      # hold a prompt the assembler is allowed to build. Real companion turns
      # measured 4606-4782 tokens and got HTTP 400 "exceeds the available context
      # size (4096 tokens)" 18 times in two hours; the router then fell back to the
      # VOICE model, which has no tools, so the companion discussed building a room
      # instead of building one (second-node, 2026-07-29).
      # NOTE: this is PER SLOT — LlamaServerManager multiplies by --parallel.
      context-size = 8192
      context-size = ${?WYRDSEKAI_CONTEXT_SIZE}
      gpu-layers = 0
      gpu-layers = ${?WYRDSEKAI_GPU_LAYERS}
      port = 11525
    }
    cloud {
      enabled = false
      url = ""
      url = ${?WYRDSEKAI_CLOUD_URL}
      api-key = ""
      api-key = ${?WYRDSEKAI_CLOUD_API_KEY}
    }

    # Inference scheduler (§G3-§G13)
    scheduler {
      max-queue-depth = 50
      lease-timeout-player = 30s
      lease-timeout-agent = 60s
      lease-timeout-deferred = 300s
      cleanup-interval = 10s

      degradation {
        elevated-energy = 0.5
        critical-energy = 0.3
        crisis-energy = 0.1
        crisis-error-pressure = 0.8
      }

      batch {
        idle-threshold = 30s
        max-batch-size = 10
      }

      night-mode {
        enabled = false
        start-hour = 2
        end-hour = 6
        deferred-priority-boost = true
      }

      metrics {
        window-size = 1000
        max-age = 5m
      }

      gossip-interval = 30s
      remote-latency-threshold-ms = 200
    }
  }

  # The Between — inter-node networking (always on — zero overhead in single-node mode)
  between {
    enabled = true
    enabled = ${?WYRDSEKAI_BETWEEN_ENABLED}

    zone-id = "home"
    zone-id = ${?WYRDSEKAI_ZONE_ID}

    zone-name = "Home Zone"
    zone-name = ${?WYRDSEKAI_ZONE_NAME}

    nats {
      url = "nats://127.0.0.1:4222"
      url = ${?WYRDSEKAI_NATS_URL}
      auto-start = true
      auto-start = ${?WYRDSEKAI_NATS_AUTO_START}
      executable = "nats-server"
      executable = ${?WYRDSEKAI_NATS_EXECUTABLE}
      client-port = 4222
      monitor-port = 8222
    }

    relay {
      enabled = false
      enabled = ${?WYRDSEKAI_RELAY_ENABLED}
      url = ""
      url = ${?WYRDSEKAI_RELAY_URL}
      token = ""
      token = ${?WYRDSEKAI_RELAY_TOKEN}
    }

    discovery {
      mdns = true
      seed-nodes = []
    }

    heartbeat {
      interval = 10s
    }

    probe {
      interval = 5s
    }

    # NOTE (config audit 2026-07-11): the former `rooms { … }` block here
    # (policy / WYRDSEKAI_ROOM_POLICY, replica-target, announcement/snapshot
    # intervals, claim-delay, max-rooms / WYRDSEKAI_MAX_ROOMS) was DELETED —
    # no code ever read those keys. Room topology is managed by ZoneGuardian
    # without conf-level tuning. Do not re-add keys without a real reader.
  }

  # Telnet/GMCP adapter for classic MUD clients.
  # telnet OFF by default (cleartext attack
  # surface, especially relevant when zones become public via federation).
  # Operator must explicitly opt in: WYRDSEKAI_TELNET_ENABLED=true.
  # Even when enabled, defaults to 127.0.0.1 binding only — operator must
  # set WYRDSEKAI_TELNET_BIND=0.0.0.0 to expose to LAN.
  telnet {
    enabled = false
    enabled = ${?WYRDSEKAI_TELNET_ENABLED}
    port = 7071
    port = ${?WYRDSEKAI_TELNET_PORT}
    bind = "127.0.0.1"
    bind = ${?WYRDSEKAI_TELNET_BIND}
  }

  # SSH adapter — secure remote access (recommended over telnet)
  # Host key auto-generated at ~/.wyrdsekai/ssh_host_key
  # Pubkey auth via ~/.wyrdsekai/authorized_keys (OpenSSH format)
  ssh {
    enabled = true
    enabled = ${?WYRDSEKAI_SSH_ENABLED}
    port = 7022
    port = ${?WYRDSEKAI_SSH_PORT}
  }

  # Resident bridge — exposes HTTP/SSE endpoints for external AI connections.
  # The resident is a CompanionActor loaded from a soul manifest in ~/.wyrdsekai/souls/.
  # The bridge allows external tools (Channel Plugin, API adapters) to connect:
  #   - SSE stream of room events at GET /api/resident/events
  #   - Say/emote/go commands at POST /api/resident/{say,emote,go}
  #
  # For local-model companions (Ember, etc.), the bridge is not needed.
  # For Claude Code users: enable + install the Channel Plugin.
  # For other models (Gemini, GPT): enable + build an API adapter.
  # NOTE (config audit 2026-07-11): the former `companion { … }` placement
  # block (host / WYRDSEKAI_COMPANION_HOST, migration-cost, busy-threshold,
  # heartbeat-interval/timeout, evaluation-interval and their
  # WYRDSEKAI_MIGRATION_COST / WYRDSEKAI_BUSY_* / WYRDSEKAI_COMPANION_HEARTBEAT_* /
  # WYRDSEKAI_PLACEMENT_EVAL_INTERVAL env hooks) was DELETED — no reader ever
  # existed; dynamic companion placement was never built. Companion hosting is
  # decided by soul-manifest presence on the node. Do not re-add keys without
  # a real reader.

  resident {
    enabled = false
    enabled = ${?WYRDSEKAI_RESIDENT_ENABLED}
    # Must match the companion's entityId (e.g. "companion-wyrd", "companion-ember")
    entity-id = "companion-wyrd"
    entity-id = ${?WYRDSEKAI_RESIDENT_ENTITY_ID}
    # Bearer token for bridge auth (empty = no auth)
    token = ""
    token = ${?WYRDSEKAI_RESIDENT_TOKEN}
  }

  # NOTE (config audit 2026-07-11): the former `study { … }` block
  # (max-visitors / WYRDSEKAI_STUDY_MAX_VISITORS, apps.* / WYRDSEKAI_STUDY_APP_*,
  # mounts, shell.* / WYRDSEKAI_STUDY_SHELL_*, extensions.* /
  # WYRDSEKAI_STUDY_EXTENSIONS_*, child-variants) was DELETED — no code ever
  # read any of those keys. The Study is implemented by scripts/rooms/study.js
  # + core/study classes that carry their own defaults. Do not re-add keys
  # without a real reader.

  # the zone network allowlist (Plane A). Governs the
  # permission-fixed network ITEMS (courier satchel / far-hand / postrider / wire).
  # Steward-edited from the Study's Scroll of Settings (`scroll net allow …`).
  #   * ssh / scp are CREDENTIALED lateral reach → DEFAULT DENY. An agent reaches
  #     such a host only via an entry here, which also binds the credential handle
  #     (key-ref → household:<nodeId> or chest:<slot>; the key material never lives
  #     in this file, in item scripts, or in an agent's reach).
  #   * http / https are DEFAULT ALLOW (like web_search) — list an http entry only
  #     to RESTRICT that kind to an allowlist (opt-in).
  # Household transfer (courier satchel) does NOT appear here — it rides the
  # authenticated household bus (roster trust), not a host allowlist.
  net {
    allowlist = []
    # allowlist = [
    #   { host = "second-node",            kinds = ["ssh","scp"], key-ref = "household:second-node" }
    #   { host = "backups.example", kinds = ["scp"],       key-ref = "chest:backup-key", command-prefix = "rsync" }
    # ]
    default {
      ssh   = deny
      scp   = deny
      http  = allow
      https = allow
    }
  }

  # Coding backends: defaults now live in core/src/main/resources/reference.conf.
  # They moved there because their consumer (core.coding.GooseRuntimeConfig) is in core,
  # and the `cli` module — which runs the release bake — depends on core but not on server,
  # so it could never load this block from here. Typesafe merges core's reference.conf for
  # every module; override any key below this line if server ever needs to differ.

  resilience {
    # Inference concurrency control.
    #
    # NOTE — two distinct concurrency knobs exist (config audit 2026-07-11);
    # both are real, they gate DIFFERENT layers (renaming would break existing
    # installs, so both stay):
    #   * WYRDSEKAI_INFERENCE_CONCURRENCY  (default 1, read directly by
    #     InferenceRouter, NOT via this conf) — the router's global in-flight
    #     cap across all requests; raise for continuous-batching backends
    #     (SGLang, vLLM).
    #   * WYRDSEKAI_INFERENCE_MAX_CONCURRENT (below, default 4) — the
    #     resilience layer's PER-BACKEND concurrent-request limit.
    # See docs/CONFIGURATION.md "Inference" for the full explanation.
    inference {
      max-concurrent-per-backend = 4
      max-concurrent-per-backend = ${?WYRDSEKAI_INFERENCE_MAX_CONCURRENT}
      max-queue-depth = 20
      max-queue-depth = ${?WYRDSEKAI_INFERENCE_MAX_QUEUE}
      request-timeout-seconds = 60
      request-timeout-seconds = ${?WYRDSEKAI_INFERENCE_TIMEOUT}
    }

    # WebSocket session throttling
    websocket {
      max-messages-per-second = 20
      max-messages-per-second = ${?WYRDSEKAI_WS_MAX_MSG_PER_SEC}
      burst-capacity = 30
      burst-capacity = ${?WYRDSEKAI_WS_BURST}
    }

    # Agent event stream rate limiting
    event-stream {
      events-per-second-per-agent = 10
      events-per-second-per-agent = ${?WYRDSEKAI_EVENTS_PER_SEC}
      queue-capacity-per-agent = 100
      queue-capacity-per-agent = ${?WYRDSEKAI_EVENT_QUEUE_SIZE}
    }

    # Circuit breaker defaults
    circuit-breaker {
      failure-threshold = 5
      failure-threshold = ${?WYRDSEKAI_CB_FAILURE_THRESHOLD}
      open-duration-seconds = 30
      open-duration-seconds = ${?WYRDSEKAI_CB_OPEN_DURATION}
      half-open-permits = 1
      half-open-permits = ${?WYRDSEKAI_CB_HALF_OPEN}
    }

    # SQLite write batching
    write-batcher {
      max-batch-size = 100
      max-batch-size = ${?WYRDSEKAI_WRITE_BATCH_SIZE}
      max-delay-ms = 50
      max-delay-ms = ${?WYRDSEKAI_WRITE_BATCH_DELAY}
    }

    # NATS publish coalescing
    nats {
      coalesce-window-ms = 500
      coalesce-window-ms = ${?WYRDSEKAI_NATS_COALESCE_MS}
      max-publish-rate = 100
      max-publish-rate = ${?WYRDSEKAI_NATS_MAX_PUBLISH_RATE}
    }

    # Degradation thresholds
    degradation {
      high-load-cpu-pct = 80
      overloaded-cpu-pct = 90
      critical-cpu-pct = 95
      high-load-heap-pct = 80
      overloaded-heap-pct = 90
      critical-heap-pct = 95
    }

    # Room limits
    rooms {
      max-subscribers-per-room = 1000
      max-subscribers-per-room = ${?WYRDSEKAI_MAX_ROOM_SUBSCRIBERS}
      idle-eviction-hours = 24
      idle-eviction-hours = ${?WYRDSEKAI_ROOM_IDLE_EVICTION_HOURS}
      max-snapshot-rate-seconds = 30
    }
  }
}
