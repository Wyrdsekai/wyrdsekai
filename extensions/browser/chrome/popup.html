<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 280px; padding: 12px; font-family: system-ui, sans-serif; font-size: 13px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; margin: 8px 0 4px; font-weight: 500; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .status { margin-top: 12px; padding: 8px; background: #f5f5f5; border-radius: 4px; font-size: 12px; }
    .status.ok { background: #e8f5e9; }
    .status.err { background: #fce4ec; }
  </style>
</head>
<body>
  <h3>Wyrdsekai — Send to Study</h3>

  <label for="server">Server URL</label>
  <input type="text" id="server" placeholder="http://localhost:7070" />

  <div class="toggle">
    <input type="checkbox" id="enabled" checked />
    <label for="enabled" style="margin:0">Track browsing (pages visited > 5s)</label>
  </div>

  <div id="status" class="status">Checking...</div>

  <script src="popup.js"></script>
</body>
</html>
