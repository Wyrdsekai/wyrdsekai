# Core module defaults — overridden by application.conf in server

# Study room defaults
wyrdsekai.study {
  max-visitors = 3
  apps {}
  mounts {}
  shell {
    enabled = true
    allowed-commands = ["ls", "find", "grep", "cat", "head", "tail", "wc", "sort", "uniq", "date", "cal", "echo", "pwd"]
    max-output-lines = 50
  }
  extensions {
    enabled = true
    path = "~/.wyrdsekai/study-extensions.js"
  }
}

# Familiar + bunshin system
wyrdsekai.familiar {
  # Per-summoning defaults — form can request up to familiar.max.* without approval
  default {
    tokens      = 1000
    steps       = 20
    wall-clock  = 60
    nest-depth  = 1
    cu          = 10
  }
  # User-configured ceiling — form author may not exceed this without approval
  max {
    tokens      = 10000
    steps       = 200
    wall-clock  = 600
    nest-depth  = 2
    cu          = 100
  }
  # §13 rules 15-17 — every shape_form dispatches a trivial dry-run against
  # the candidate form with ≤10% default tanks. Fails reject the shape.
  # Set false to skip (offline / cost-constrained deployments).
  dynamic-validation.enabled = true
}

wyrdsekai.bunshin {
  # Default concurrent bunshin per primary
  max-concurrent      = 2
  # Elastic grant may go to this if cost + inference slots allow
  elastic-concurrent  = 3
  # Absolute ceiling — steward refuses beyond this regardless of user approval
  absolute-ceiling    = 5
}

wyrdsekai.promotion {
  # Forge auto-computes eligibility + offers ceremony at next wake
  auto-eligibility              = true
  require-steward               = false
  max-residents-per-user        = 10
  # §17.3 — steward refuses promotion when the household is under resource pressure.
  reject-on-resource-pressure   = true
  # Residents-in-zone ceiling (humans + agents). Above this, promotion is refused.
  # Steward may raise via `scroll set wyrdsekai.promotion.zone-resource-ceiling=N`.
  zone-resource-ceiling         = 50
}

# ── Native / imported skills ────────────────────────────────
# Flattened into SkillBootstrap.create()'s flat-key map by configFromHocon()
# (wyrdsekai.skills.openclaw.url → "openclaw.url"). A key present + non-blank
# lights the matching executor at boot; absent keys leave it unregistered.
# All keys are steward-settable; env passthroughs cover the common ones.
wyrdsekai.skills {
  # OpenClaw gateway ( Option B — `wyrd openclaw setup`).
  # WebSocket URL of the containerized skill gateway; the executor loads the
  # catalogue on connect and reconnects with backoff.
  openclaw.url = ${?WYRDSEKAI_SKILLS_OPENCLAW_URL}
  # Knowledge / home / calendar / voice / notes
  kiwix.url    = ${?WYRDSEKAI_SKILLS_KIWIX_URL}
  ha.url       = ${?WYRDSEKAI_SKILLS_HA_URL}
  caldav.url   = ${?WYRDSEKAI_SKILLS_CALDAV_URL}
  whisper.url  = ${?WYRDSEKAI_SKILLS_WHISPER_URL}
  obsidian.vault_path = ${?WYRDSEKAI_SKILLS_OBSIDIAN_VAULT}
  # Chat / phone
  signal.phone = ${?WYRDSEKAI_SKILLS_SIGNAL_PHONE}
  # Emergency contacts for herald.call.emergency: "Name:phone[:relation],…".
  # The jurisdiction dial (911/988/…) needs no contact — it uses the number
  # from WYRDSEKAI_EMERGENCY_JURISDICTION routing. Telephony credentials live
  # in the credential chain (The Safe slots twilio.account_sid /
  # twilio.auth_token / twilio.from_number, or WYRDSEKAI_CRED_TWILIO_* env).
  emergency.contacts = ${?WYRDSEKAI_SKILLS_EMERGENCY_CONTACTS}
  # Boolean enables (gcal.enabled, gmail.enabled, gchat.enabled,
  # keybase.enabled, outlook.enabled, privacy.enabled, stripe.enabled,
  # rss.enabled, books.enabled) and path keys (transit.gtfs_path, fs.mounts,
  # filesearch.roots, docs.path, email.credentials) may be set here or in
  # wyrdsekai.conf the same way.
}

# ── MCP hard spend cap (0.5b — the minimum Accelerando safeguard) ────────────
# Per-agent, per-service, per-day USD ceiling on METERED MCP services,
# enforced inside McpGatewayService.execute (default-on; free/local services
# never accrue spend so they are never denied). Over-cap calls are refused
# with a narrative the companion speaks.
wyrdsekai.mcp {
  daily-spend-cap = 10.0
  daily-spend-cap = ${?WYRDSEKAI_MCP_DAILY_SPEND_CAP}
}

# ── Agent network reach ────────────────────────────
# Read by org.wyrdsekai.core.net.NetworkGate/NetworkWiring. The credentialed
# kinds (ssh/scp) start CLOSED — a companion reaches such a host only after the
# steward allowlists it (`use scroll net allow <host> ssh,scp --key
# household:<node>` in the Study, hot-reloads; or an entry here at install
# time). HTTP/HTTPS stay open by default like web_search — an http entry here
# would flip that host-set to restrict-mode (opt-in).
wyrdsekai.net {
  default {
    ssh   = deny
    scp   = deny
    http  = allow
    https = allow
  }
  # allowlist = [
  #   { host = "second-node", kinds = ["ssh", "scp"], key-ref = "household:second-node",
  #     command-prefix = null }
  # ]

  # Courier satchel (household file transfer over the roster-verified bus).
  courier {
    # A relative destination lands in the RECEIVING node's courier inbox
    # ($WYRDSEKAI_DATA_DIR/courier/). Absolute destinations are refused
    # unless the receiving steward opts in here — an enrolled peer must not
    # be able to overwrite arbitrary files on this machine by default.
    allow-absolute = false
    # Per-file size cap in bytes (32 MiB).
    max-bytes = 33554432
  }
}

# ── Coding backends ────────────────────────────────
# These defaults live in CORE, not in server's application.conf, because the code
# that reads them lives in core (org.wyrdsekai.core.coding.GooseRuntimeConfig) and
# core is the only module every consumer shares.
#
# They used to sit in server/application.conf. RecipeBakeMain is in the `cli`
# module, which depends on core but NOT on server — so its ConfigFactory.load()
# never saw this block, `goose.enabled` read as absent/false, and every release
# bake died with "goose disabled in config … set it in ~/.wyrdsekai/wyrdsekai.conf",
# advice that could not work: the ${?WYRDSEKAI_CODING_GOOSE_ENABLED} override was
# also stranded in the file cli couldn't load. Config must ship with its consumer.
#
# Typesafe merges reference.conf from every jar on the classpath, so both server
# and cli now resolve these identically; server's application.conf may still
# override any key.
wyrdsekai {
  # Coding-task delegation backends.
  # Phase 1b ships the schema only — no platform decisions are made here.
  # CodePlane stays the reference implementation; the others are named so
  # households can tune them in-place without a recompile, but their
  # `enabled = false` defaults mean nothing changes until the steward
  # opts in (and provides any required Key Chest slot — see §9.2).
  #
  # Per-backend objects use a permissive shape: the validator only checks
  # core keys (enabled / tier / url / namespace / model / key_chest_slot).
  # Backend-specific extras (max_files_per_task, max_ram_gb, extra_flags,
  # docker_image, …) are accepted as-is so future backends don't require
  # schema bumps.
  coding {
    # Default backend when nothing else applies. The selection-policy
    # script in `policy_script` may override per task.
    default-backend = "goose"
    default-backend = ${?WYRDSEKAI_CODING_DEFAULT_BACKEND}

    # coding-backend egress gate. Every subprocess
    # backend (Goose, and future OpenClaw/OpenCode/Codex adapters) spawns a
    # real shell that, ungated, inherits the daemon's FULL environment —
    # SSH_AUTH_SOCK, ambient keys, cloud tokens. A prompt-injected agent could
    # dispatch `ssh host …` and pivot with the steward's credentials.
    # ENFORCING BY DEFAULT: the gate scrubs the subprocess env down to an
    # explicit allowlist (PATH/HOME/locale + the local-llama-server routing),
    # dropping every ambient credential. Plain outbound HTTP is NOT blocked —
    # the gate removes key-backed lateral movement, not web access. Steward
    # opts out per-household (or per-backend) only when they explicitly trust a
    # backend with real keys. Toggle from the Study's Scroll of Settings.
    egress-gate {
      enabled = true
      enabled = ${?WYRDSEKAI_CODING_EGRESS_GATE}
      # Parent-env vars re-admitted to the scrubbed subprocess. Excludes
      # SSH_AUTH_SOCK and every *_KEY/_TOKEN/_SECRET by omission.
      env-allowlist = ["PATH", "HOME", "LANG", "LC_ALL", "LC_CTYPE", "TMPDIR",
                       "TZ", "TERM", "OPENAI_HOST", "OPENAI_API_KEY",
                       "GOOSE_PROVIDER", "GOOSE_MODEL"]
      # "env" (phase 1 — scrub, shipped) | "netns" (phase 2 — OS-enforced sandbox)
      sandbox = "env"
    }

    # Live-tunable selection rules — see scripts/policy/coding-backend.js.
    # Households can edit the file directly; changes apply on next dispatch
    # (no restart required, ScriptLoader picks up mtime changes).
    policy-script = "scripts/policy/coding-backend.js"
    policy-script = ${?WYRDSEKAI_CODING_POLICY_SCRIPT}

    # Ordered fallback chain — the selection-policy script walks this list
    # and picks the first healthy + policy-allowed backend; this order is
    # therefore the *effective* default priority (default-backend above is
    # only the last-ditch fallback when nothing in the chain is allowed).
    # Order per SPEC §2.6:
    #   1. Goose (default — Rust binary, tri-platform; with the default
    #      provider=openai → local llama-server it is local-free, and it
    #      tool-uses the 9B reliably where pi did not; e2e-proven)
    #   2. Pi  (local-llama-capable, MIT, ~12MB npm — cross-platform fallback)
    #   3. CodePlane (in-world spatial workflow when available)
    #   4. OpenHands (heavy autonomous, Docker bind-mount, pipeline-proven)
    #   5. Claude SDK (subscription OAuth or API key, pipeline-proven)
    #   6. OpenCode / Cline / Continue (wired, EXPERIMENTAL)
    #   7. Codex / Gemini-CLI (paid, EXPERIMENTAL)
    #   8. Devin (last — async cloud, $$, EXPERIMENTAL)
    # Households override per their preferences via wyrd config.
    fallback-chain = [
      "goose",
      "pi",
      "codeplane",
      "openhands",
      "claude-sdk",
      "opencode", "cline", "continue",
      "codex", "gemini-cli",
      "devin"
    ]

    backends {
      codeplane {
        enabled = true
        enabled = ${?WYRDSEKAI_CODING_CODEPLANE_ENABLED}
        url = "ws://127.0.0.1:8080/ws/zone"
        url = ${?WYRDSEKAI_CODING_CODEPLANE_URL}
        namespace = "codeplane"
        tier = "LOCAL_HEAVY"
      }
      # OpenCode default-on backend.
      # Points at the household's local llama-server via the OpenAI-
      # compatible endpoint; complex items work out of the box.
      # Phase 2a will land the bundled binary; until then the executable
      # must be on PATH (or `wyrd coding install opencode` once available).
      opencode {
        enabled = true
        enabled = ${?WYRDSEKAI_CODING_OPENCODE_ENABLED}
        tier = "LOCAL_FREE"
        executable-path = "opencode"
        executable-path = ${?WYRDSEKAI_CODING_OPENCODE_EXECUTABLE}
        base-url = "http://localhost:8200/v1"
        base-url = ${?WYRDSEKAI_CODING_OPENCODE_BASE_URL}
        model = "wyrdsekai-3.5-9b-vitality-v6"
        model = ${?WYRDSEKAI_CODING_OPENCODE_MODEL}
        provider-name = "wyrd-local"
        api-key = "not-required"
        api-key = ${?WYRDSEKAI_CODING_OPENCODE_API_KEY}
        max-files-per-task = 50
        max-wallclock-min = 30
        extra-flags = []
      }
      aider {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_AIDER_ENABLED}
        tier = "LOCAL_FREE"
        # Aider runs against the household's local Qwen by default.
        # The model id is opaque to wyrdsekai — Aider's own config
        # decides how to reach it.
        model = "wyrdsekai-3.5-9b-vitality-v6"
        model = ${?WYRDSEKAI_CODING_AIDER_MODEL}
        max-files-per-task = 10
        extra-flags = ["--no-pretty", "--yes-no-color"]
      }
      openhands {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_OPENHANDS_ENABLED}
        tier = "LOCAL_HEAVY"
        # MCP endpoint — OpenHands runs as a long-lived service per
        # SPEC §6 Q5; the adapter speaks MCP straight to it instead of
        # subprocessing the CLI per task.
        mcp-url = "http://localhost:3000/mcp"
        mcp-url = ${?WYRDSEKAI_CODING_OPENHANDS_MCP_URL}
        # Pinned via `wyrd setup openhands` — leave empty in source mode
        # so the manifest's docker_image is used as the default fallback.
        docker-image = "ghcr.io/all-hands-ai/openhands:latest"
        docker-image = ${?WYRDSEKAI_CODING_OPENHANDS_IMAGE}
        # Per-task resource limits (SPEC §6 Q2). OpenHands enforces these
        # via its sandbox; we forward them as MCP submit-tool arguments.
        max-ram-gb = 2
        max-ram-gb = ${?WYRDSEKAI_CODING_OPENHANDS_MAX_RAM_GB}
        max-disk-gb = 5
        max-disk-gb = ${?WYRDSEKAI_CODING_OPENHANDS_MAX_DISK_GB}
        max-wallclock-min = 30
        max-wallclock-min = ${?WYRDSEKAI_CODING_OPENHANDS_MAX_WALLCLOCK_MIN}
        # LLM provider OpenHands should route to ("anthropic", "openai",
        # "local"). Local uses the household's llama-server.
        default-provider = "local"
        default-provider = ${?WYRDSEKAI_CODING_OPENHANDS_PROVIDER}
      }
      # Phase 2e — Claude Code SDK (npm @anthropic-ai/claude-code).
      # Headless OAuth via `claude login --no-browser` (paste-this-URL
      # device flow); API-key fallback via ANTHROPIC_API_KEY.
      claude-sdk {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_CLAUDE_SDK_ENABLED}
        tier = "CLOUD_PAID"
        executable-path = "claude"
        executable-path = ${?WYRDSEKAI_CODING_CLAUDE_SDK_EXECUTABLE}
        model = "sonnet"
        model = ${?WYRDSEKAI_CODING_CLAUDE_SDK_MODEL}
        # When the resolver returns ApiKey, pass --bare to skip
        # OAuth/keychain reads; OAuthSession path never sets --bare.
        use-bare = true
        max-wallclock-min = 30
        key-required = true
        key-chest-slot = "ANTHROPIC_API_KEY"
        max-cu-per-task = 1000
        extra-flags = []
      }
      # Phase 2f — Pi (pi.dev, @mariozechner/pi-coding-agent, MIT).
      # Lightweight subprocess CLI; routes to 15+ providers via
      # ~/.pi/agent/models.json (Anthropic, OpenAI, Google, …, plus
      # OpenAI-compatible local llama-server). Pipeline-proven against
      # the wyrdsekai 9B drive — default backend.
      pi {
        enabled = true
        enabled = ${?WYRDSEKAI_CODING_PI_ENABLED}
        tier = "LOCAL_FREE"
        executable-path = "pi"
        executable-path = ${?WYRDSEKAI_CODING_PI_EXECUTABLE}
        # Default to local llama (matches the wyrdsekai-bundled 9B drive).
        # Household must have run `wyrd setup pi` once to seed
        # ~/.pi/agent/models.json with a "local" provider pointing at the
        # llama-server URL — bin/wyrd does that idempotently. Override
        # via env when routing to a cloud provider.
        model = "wyrdsekai-3.5-9b-v5-q4km.gguf"
        model = ${?WYRDSEKAI_CODING_PI_MODEL}
        provider = "local"
        provider = ${?WYRDSEKAI_CODING_PI_PROVIDER}
        no-session = true
        max-wallclock-min = 30
      }
      # Phase 2e — Codex CLI (Rust binary, openai/codex GitHub releases).
      # Headless mode: `codex exec "<prompt>" --json`. OAuth via
      # `codex login --device-auth`; API-key via OPENAI_API_KEY.
      codex {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_CODEX_ENABLED}
        tier = "CLOUD_PAID"
        executable-path = "codex"
        executable-path = ${?WYRDSEKAI_CODING_CODEX_EXECUTABLE}
        model = "gpt-5"
        model = ${?WYRDSEKAI_CODING_CODEX_MODEL}
        # provider lets codex pick its default when null/blank
        wallclock-min = 30
        key-required = true
        key-chest-slot = "OPENAI_API_KEY"
        max-cu-per-task = 1000
        extra-flags = []
      }
      # Goose (aaif-goose/goose v1.33.1, AAIF/Linux Foundation).
      # Headless argv: `goose run --text <DESC> --output-format json
      # --no-session -q [--provider <P>] [--model <M>]`. Workspace is
      # the subprocess CWD (no flag for it). Default provider is openai
      # paired with the bundled local llama-server via OPENAI_HOST
      # — points at http://localhost:8200/v1 with model
      # wyrdsekai-3.5-9b-v5-q4km.gguf out of the box.
      goose {
        # Default coding backend (SPEC §2.6). Enabled by default; the
        # health probe falls through to the fallback chain (pi, …) when the
        # goose binary isn't installed, so this is safe on hosts without it.
        enabled = true
        enabled = ${?WYRDSEKAI_CODING_GOOSE_ENABLED}
        tier = "CLOUD_PAID"
        # key-required is provider-dependent. anthropic / google /
        # databricks / openai-against-real-OpenAI need a key; ollama and
        # openai-against-llama-server do not. The adapter resolves this
        # at submitTask time via providerKeyEnvVarFor(provider).
        key-required = false
        # Per-provider key chest slot — the adapter reads the resolved
        # ApiKey and plants it in the upstream env var keyed off provider.
        # Pre-2026-05 this was GOOSE_PROVIDER_KEY (a wyrdsekai invention);
        # upstream Goose doesn't read that name.
        key-chest-slot = "ANTHROPIC_API_KEY"
        provider = "openai"
        provider = ${?WYRDSEKAI_CODING_GOOSE_PROVIDER}
        model = "wyrdsekai-3.5-9b-v5-q4km.gguf"
        model = ${?WYRDSEKAI_CODING_GOOSE_MODEL}
        base-url = "http://localhost:8200/v1"
        base-url = ${?WYRDSEKAI_CODING_GOOSE_BASE_URL}
        max-wallclock-min = 30
        extra-flags = []
      }
      # Phase 2e — Gemini CLI. npm-distributed; v0.40.1+ (CVSS-10 RCE
      # patch floor). API-key only on headless hosts (no device-flow
      # OAuth as of May 2026 — issue google-gemini/gemini-cli#1696).
      gemini-cli {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_GEMINI_CLI_ENABLED}
        tier = "CLOUD_PAID"
        executable-path = "gemini"
        executable-path = ${?WYRDSEKAI_CODING_GEMINI_CLI_EXECUTABLE}
        model = "gemini-2.5-flash"
        model = ${?WYRDSEKAI_CODING_GEMINI_CLI_MODEL}
        # -1.0 sentinel = "use upstream default temperature".
        temperature = -1.0
        # Post-RCE: headless mode requires explicit workspace trust.
        # Opt in deliberately; defaults to false.
        trust-workspace = false
        max-wallclock-min = 30
        extra-flags = []
      }
      # Phase 2e — Devin (async cloud, REST-only). HIGH default CU
      # estimate (5000) — sessions routinely run hours and cost real $$.
      devin {
        enabled = false
        enabled = ${?WYRDSEKAI_CODING_DEVIN_ENABLED}
        tier = "CLOUD_PAID"
        # Required: Devin partitions sessions under organisations.
        # No smart default — steward must set this.
        org-id = ""
        org-id = ${?WYRDSEKAI_CODING_DEVIN_ORG_ID}
        api-base = "https://api.devin.ai"
        api-base = ${?WYRDSEKAI_CODING_DEVIN_API_BASE}
        poll-interval-sec = 10
        max-wallclock-hours = 4
        max-wallclock-hours = ${?WYRDSEKAI_CODING_DEVIN_MAX_WALLCLOCK_HOURS}
        request-timeout-sec = 60
      }
    }
  }

  # Production resilience — all values configurable via env vars
}
