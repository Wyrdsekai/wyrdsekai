# Wyrdsekai Relay — NATS Server Configuration
# Dumb pipe. Routes messages. Stores nothing.
#

listen: 0.0.0.0:4222

# Localhost-only HTTP monitoring endpoint. Bound to loopback so the
# registration sidecar's liveness reaper can poll /connz?auth=1 (to learn
# which household NKeys hold a live connection) WITHOUT exposing any
# monitoring surface publicly — Caddy never fronts :8222. Survives auth-block
# regeneration because update_nats_config only rewrites `authorization`.
http: "127.0.0.1:8222"

websocket {
    # WS is docker-internal plaintext; Caddy owns
    # ALL public TLS (self-signed leaf on :4443, ACME on :443 when
    # RELAY_DOMAIN is set) and reverse-proxies WebSocket traffic here.
    # The port is never published on the host. Clients are unaffected:
    # they still speak wss:// to the same host:port, and in LAN mode the
    # leaf Caddy serves is the SAME certinit leaf NATS used to serve, so
    # existing TOFU pins survive the migration.
    #
    # History: this listener was native WS-TLS on :4443 (
    # RELAY_ADD §10.3); before that, Caddy:443-terminated plaintext on
    # :9222 — we return to Caddy termination, on :9222, because ACME
    # certs have to live in exactly one place and that place is Caddy.
    listen: "0.0.0.0:9222"
    no_tls: true
}

# Household tokens — one entry per household.
# Generated by the household server on first setup.
# Add households by appending entries and reloading: nats-server --signal reload
#
# Each household is scoped to its own namespace (between.{householdId}.>)
# so households cannot see each other's traffic.
#
# Example:
#   { user: "hh-abc123", password: "<256-bit-base64url-token>",
#     permissions: {
#       publish: { allow: ["between.abc123.>"] }
#       subscribe: { allow: ["between.abc123.>"] }
#     }
#   }
authorization {
    users = [
        { user: "relay_sidecar", password: "__GENERATED_ON_FIRST_RUN__",
          permissions: {
            publish:   { allow: ["relay.>", "_INBOX.>"] }
            subscribe: { allow: ["relay.>", "_INBOX.>"] }
          }
        },
        { user: "relay_phone", password: "__GENERATED_ON_FIRST_RUN__",
          permissions: {
            # wyrd.tunnel.>: phones/CLI/TUI open
            # `wyrd.tunnel.{zone}.{session}.{open,up,close}` and read `.down`.
            # Without it the dumb session pipe is dead for every relay client.
            publish:   { allow: ["wyrd.zone.>", "wyrd.discover.>", "wyrd.tunnel.>", "_INBOX.>"] }
            subscribe: { allow: ["wyrd.tunnel.>", "_INBOX.>"] }
          }
        },
        { user: "peer_trainer", password: "__GENERATED_ON_FIRST_RUN__",
          permissions: {
            publish:   { allow: ["wyrdsekai.training.peer.>", "_INBOX.>"] }
            subscribe: { allow: ["wyrdsekai.training.peer.>", "_INBOX.>"] }
          }
        },
        { user: "relay_join", password: "__GENERATED_ON_FIRST_RUN__",
          permissions: {
            publish:   { allow: ["relay.register", "relay.re-register", "relay.peer.list", "relay.status", "_INBOX.>"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
    ]
}

# Limits
# 1 MB payload — large enough for peer-training adapter chunks (512 KB raw
# → ~700 KB after base64 + JSON envelope) plus headroom. The household
# Between envelope is far smaller (~few KB), so this only matters for
# peer-training and nothing else suffers from the bump.
max_payload: 1048576      # 1 MB
max_connections: 1000     # Total across all households
max_control_line: 4096
max_pending: 268435456    # 256MB — prevent slow consumer disconnects during heartbeat bursts

# Logging — stdout for Docker (use log_file for bare metal)
# log_file: "/var/log/nats/relay.log"
# log_size_limit: 10485760  # 10MB rotation
