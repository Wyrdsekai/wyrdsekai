# NATS server configuration for Wyrdsekai household mesh
listen: 0.0.0.0:4222
http_port: 8222

# Write deadline: time to write to a client before closing.
# Default 10s is too aggressive for WiFi clients that may be
# busy during startup (Pekko init, room seeding, etc.).
write_deadline: "60s"

# Prevent NATS from advertising Docker-internal IPs in connect_urls.
# Without this, clients receive 172.17.0.x as a reconnect URL and fail
# with NoRouteToHost when the container is behind Docker bridge networking.
# no_advertise is a cluster-level option — use client_advertise to override
# what standalone NATS tells clients for reconnection.
client_advertise: "0.0.0.0:4222"

max_payload: 1048576
max_connections: 64

# JetStream — enabled for future zone-to-zone relay messaging.
# Household replication uses pub/sub + HTTP sync (not JetStream).
jetstream {
  store_dir: "/data/jetstream"
}

# WebSocket listener for mobile clients (NATS-over-WS, G2 2026-07-11)
websocket {
  listen: "0.0.0.0:4223"
  no_tls: true
}
