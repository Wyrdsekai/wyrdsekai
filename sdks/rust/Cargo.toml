[package]
name = "wyrdsekai-zone"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for Wyrdsekai Zone Bridge — connect external services to a text-native distributed world."
license = "Apache-2.0"
repository = "https://github.com/wyrdsekai/wyrdsekai"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[[example]]
name = "hello_zone"
path = "examples/hello_zone.rs"
