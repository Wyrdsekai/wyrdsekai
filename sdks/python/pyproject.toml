[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wyrdsekai-zone"
version = "0.1.0"
description = "Python SDK for Wyrdsekai Zone Bridge — connect external services to a text-native distributed world."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["websockets>=13.0"]

[project.urls]
Homepage = "https://github.com/wyrdsekai/wyrdsekai"
Documentation = "https://github.com/wyrdsekai/wyrdsekai/tree/main/sdks/python"
